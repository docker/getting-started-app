# Development baseline: "docker compose up" alone must yield a working
# application, database and broker included.
#
# The "version:" key no longer exists in Compose v2 and is deliberately absent.

name: legacy-kanban

services:

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_dev_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/kanban-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # MySQL
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DB:-todos}
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo_dev_password}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-monitoring_dev_password}

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./monitoring/mysql/init-monitoring.sh:/docker-entrypoint-initdb.d/10-monitoring.sh:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "--silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=prometheus
      - --collect.global_status
      - --collect.global_variables
      - --no-collect.slave_status
      - --no-collect.info_schema.innodb_cmp
      - --no-collect.info_schema.innodb_cmpmem
      - --no-collect.info_schema.query_response_time
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-monitoring_dev_password}
    depends_on:
      mysql:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # RabbitMQ
  # -------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------------------
  # Drizzle migrations
  # -------------------------------------------------------------------------
  migration:
    build:
      context: .
      target: migration

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo_dev_password}
      MYSQL_DB: ${MYSQL_DB:-todos}

    depends_on:
      mysql:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # API
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      target: runtime

    restart: unless-stopped

    ports:
      - "${API_PORT:-3000}:3000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo_dev_password}
      MYSQL_DB: ${MYSQL_DB:-todos}

      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      # legacy|drizzle (ADR 0001). Unset here defaults to legacy in the app
      # itself; run `npm run db:migrate` against this database first if you
      # switch to drizzle — it never creates tables on its own.
      PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-legacy}
      # This stack serves plain HTTP, and a Secure session cookie is dropped
      # over HTTP by some browsers even on localhost. Any exposed deployment
      # serves HTTPS and leaves this unset, which keeps the cookie Secure.
      # /auth needs the users and sessions tables: `npm run db:migrate` first.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      migration:
        condition: service_completed_successfully

      rabbitmq:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Notification worker
  # -------------------------------------------------------------------------
  worker:
    build:
      context: .
      target: runtime

    restart: unless-stopped

    command:
      [
        "node",
        "build/workers/notifications/index.js"
      ]

    # Private metrics listener; readiness also checks consumer registration.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo_dev_password}
      MYSQL_DB: ${MYSQL_DB:-todos}

      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672

      PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-drizzle}

    depends_on:
      migration:
        condition: service_completed_successfully

      rabbitmq:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------

volumes:
  # grafana-data:
  # prometheus-data:
  mysql-data:
  rabbitmq-data:
